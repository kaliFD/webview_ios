name: Build iOS (Unsigned IPA)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: flutter build ipa --release --no-codesign
          
      - name: Package into IPA
        run: |
          mkdir -p Payload
          # Extract the Runner.app from the xcarchive
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r CBT_MA_2026_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT_MA_2026_Unsigned_IPA
          path: CBT_MA_2026_Unsigned.ipa
          retention-days: 7
