name: Build iOS (Unsigned IPA)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          # Build flutter assets (this might fail at Xcode phase due to no team)
          flutter build ios --release --no-codesign || true
          # Force build with Xcode and strictly ignore signing
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          
      - name: Package into IPA
        run: |
          mkdir -p Payload
          # Move the compiled Runner.app into the Payload folder
          mv ios/build/Release-iphoneos/Runner.app Payload/
          zip -r CBT_MA_2026_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT_MA_2026_Unsigned_IPA
          path: CBT_MA_2026_Unsigned.ipa
          retention-days: 7
