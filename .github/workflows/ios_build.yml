name: Build iOS (Unsigned IPA)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Xcode Config (Simulator Bypass)
        run: flutter build ios --config-only --simulator

      - name: Generate Fake Code Signing Certificate
        run: |
          # Flutter CLI strictly checks for 'security find-identity -p codesigning -v' before building.
          # We generate a fake self-signed cert with Code Signing EKU to satisfy Flutter's check.
          cat > ext.cnf << 'EOF'
          [ req ]
          distinguished_name = req_distinguished_name
          x509_extensions = v3_req
          prompt = no
          [ req_distinguished_name ]
          CN = iPhone Developer: Fake Cert (12345)
          [ v3_req ]
          keyUsage = digitalSignature
          extendedKeyUsage = codeSigning
          EOF
          
          # Generate the certificate
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes -config ext.cnf
          openssl pkcs12 -export -out cert.p12 -inkey key.pem -in cert.pem -password pass:test
          
          # Create and configure keychain
          security create-keychain -p "test" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "test" build.keychain
          
          # Import the fake certificate into the keychain
          security import cert.p12 -k build.keychain -P "test" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "test" build.keychain
          
          # Verify that it shows up in codesigning identities!
          security find-identity -p codesigning -v

      - name: Setup Podfile Bypasses
        run: |
          # Although we have a fake cert, we still want to force NO codesigning for CocoaPods targets
          cat << 'EOF' >> ios/Podfile
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGN_REQUIRED'] = 'NO'
              end
            end
            
            # Disable signing for the main app target as well!
            installer.aggregate_targets.each do |target|
              target.user_project.targets.each do |app_target|
                app_target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGN_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                end
              end
              target.user_project.save
            end
          end
          EOF

      - name: Build Unsigned IPA
        run: |
          # Now that Flutter sees a valid codesigning identity, it won't crash prematurely.
          # The --no-codesign flag + our Podfile hook will ensure the final binary is unsigned.
          flutter build ipa --release --no-codesign
          
      - name: Package Unsigned App
        run: |
          mkdir -p Payload
          # Move the compiled Runner.app into the Payload folder
          mv build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/ || mv build/ios/iphoneos/Runner.app Payload/
          zip -r CBT_MA_2026_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT_MA_2026_Unsigned_IPA
          path: CBT_MA_2026_Unsigned.ipa
          retention-days: 7
