name: Build iOS (Unsigned IPA)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Adjust flutter version as needed
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign
          
      - name: Package into IPA
        run: |
          # Create a Payload directory
          mkdir -p Payload
          # Move the compiled Runner.app into the Payload folder
          mv build/ios/iphoneos/Runner.app Payload/
          # Zip the Payload folder into an .ipa file
          zip -r CBT_MA_2026_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBT_MA_2026_Unsigned_IPA
          path: CBT_MA_2026_Unsigned.ipa
          retention-days: 7
